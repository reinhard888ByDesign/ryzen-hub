<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ryzen Hub{% endblock %}</title>
  {# FOUC-Vermeidung (AP210): Theme vor jedem Stylesheet setzen. #}
  <script>try{var t=localStorage.getItem('hub-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="stylesheet" href="/ui/hub-ui.css">
  <script src="/ui/hub-ui.js" defer></script>
</head>
<body class="hub-ui">

  <!-- ── Hamburger (nur mobil sichtbar) ──────────────────── -->
  <button class="hamburger" id="hamburger-btn" onclick="toggleSidebar()" aria-label="Menü">
    <span id="hamburger-icon">☰</span>
  </button>

  <!-- ── Overlay hinter der mobilen Sidebar ───────────────── -->
  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- ── Sidebar: nur System-Eintraege (AP210) ────────────── -->
  <nav class="sidebar">
    <a href="/" class="sidebar-logo" style="text-decoration:none; color:inherit;">
      <div class="sidebar-logo-mark">⚡</div>
      <div>
        <div class="sidebar-logo-text">Ryzen Hub</div>
        <div class="sidebar-logo-sub">Lokale Infrastruktur</div>
      </div>
    </a>

    <div class="nav-section">
      <a href="/" class="nav-item {% if active is none %}active{% endif %}">
        <span class="nav-icon">🏠</span>
        <span class="nav-name">Übersicht</span>
      </a>
    </div>

    {% if ist_admin %}
    <div class="nav-section">
      <a href="/verwaltung" class="nav-item {% if active == 'verwaltung' %}active{% endif %}">
        <span class="nav-icon">⚙️</span>
        <span class="nav-name">Verwaltung</span>
      </a>
    </div>
    {% endif %}

    <div class="sidebar-footer">
      <div class="sidebar-user">{{ nutzer }}{% if ist_admin %} · Admin{% endif %}</div>
      <button type="button" class="sidebar-theme" data-hub-theme>
        <span class="nav-icon">🎨</span>
        <span class="nav-name">Farbschema</span>
      </button>
      <a href="/logout" class="nav-item">↩ Abmelden</a>
    </div>
  </nav>

  <!-- ── Main ────────────────────────────────────────────── -->
  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <script>
    // Mobile Sidebar Toggle (AP202/AP210)
    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.getElementById('overlay');
      const icon = document.getElementById('hamburger-icon');
      const isOpen = !sidebar.classList.contains('open');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
      icon.textContent = isOpen ? '✕' : '☰';
    }
    function closeSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.getElementById('overlay');
      const icon = document.getElementById('hamburger-icon');
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
      icon.textContent = '☰';
    }
  </script>
</body>
</html>
